<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destinations</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>
     <!-- ===============================
         NAVBAR
    ================================ -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">

        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-airplane"></i> WanderWorld
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div class="collapse navbar-collapse"
                 id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link"
                           href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active"
                           href="destinations.html">
                            Destinations
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="packages.html">
                            Packages
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="about.html">
                            About
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="contact.html">
                            Contact
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>
    <!-- ===============================
         DESTINATION HEADER
    ================================ -->

    <section class="text-center py-5">

        <div class="container">

            <h1>
                🌍 Explore Our Destinations
            </h1>

            <p class="text-muted">
                Discover beautiful places around the world
            </p>

        </div>

    </section>
    <!-- ===============================
         SEARCH & FILTER
    ================================ -->

    <section class="container mb-5">

        <div class="row g-3 justify-content-center">

            <div class="col-md-6">

                <input
                    type="text"
                    id="destinationSearch"
                    class="form-control"
                    placeholder="🔍 Search destinations...">

            </div>

            <div class="col-md-3">

                <select
                    id="categoryFilter"
                    class="form-select">

                    <option value="all">
                        All Destinations
                    </option>

                    <option value="beach">
                        🏖️ Beach
                    </option>

                    <option value="city">
                        🏙️ City
                    </option>

                    <option value="adventure">
                        🏔️ Adventure
                    </option>

                    <option value="nature">
                        🌿 Nature
                    </option>

                </select>

            </div>

        </div>

    </section>
    <!-- ===============================
         DESTINATION CARDS
    ================================ -->

    <section class="container">

        <div
            class="row g-4"
            id="destinationContainer">

            <!-- JavaScript will create cards here -->

        </div>

    </section>
     <!-- ===============================
         DESTINATION MODAL
    ================================ -->

    <div
        class="modal fade"
        id="destinationModal"
        tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="modalDestinationName">
                        Destination
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <img
                        id="modalDestinationImage"
                        src=""
                        alt="Destination"
                        class="img-fluid rounded mb-3">

                    <p>
                        📍
                        <span id="modalDestinationLocation"></span>
                    </p>

                    <p id="modalDestinationDescription"></p>

                    <p>
                        🏷️ Category:
                        <span id="modalDestinationCategory"></span>
                    </p>

                </div>

                <div class="modal-footer">
                    <button
                    type="button"
                    class="btn btn-success"
                    id="destinationBookNow">
                    🎫 Book Now

                    </button>

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Close

                    </button>

                </div>

            </div>

        </div>

    </div>
    <!-- ================= FOOTER ================= -->

    <footer class="bg-dark text-white text-center py-4">

        <div class="container">

            <h5>
                <i class="bi bi-airplane"></i> WanderWorld
            </h5>

            <p class="mb-2">
                Explore. Discover. Experience.
            </p>

            <div class="social-icons">

                <i class="bi bi-facebook"></i>
                <i class="bi bi-instagram"></i>
                <i class="bi bi-twitter"></i>
                <i class="bi bi-youtube"></i>

            </div>

            <hr>

            <p class="mb-0">
                © 2026 WanderWorld. All Rights Reserved.
            </p>

        </div>

    </footer>
    <script src="js/destinations.js"></script>




</body>
</html>
